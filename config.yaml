ticker: 0700.HK
period: 5y
train_years: 5
backtest_engine: native
data_sources:
  - tickflow
  - yahooquery
  - yfinance
storage_format: csv
batch_max_workers: 4

fees_rate: 0.00088
# 港股现货交易费用（2026 年口径）。券商佣金和平台费请按实际账户调整。
hk_trading_fees:
  stamp_duty_rate: 0.001
  sfc_levy_rate: 0.000027
  afrc_levy_rate: 0.0000015
  hkex_trading_fee_rate: 0.0000565
  settlement_fee_rate: 0.000042
  broker_commission_rate: 0.0008
  broker_commission_min: 0.0
  platform_fee: 0.0
  # ETF 等印花税豁免证券必须显式列在这里，不根据代码臆测。
  stamp_duty_exempt_tickers: []
initial_capital: 100000.0
invest_fraction: 0.95
lookback_months: 3
max_tries: 300
use_optuna: true
# optuna 每策略试验次数已硬编码在 pipeline/train.py:OPTUNA_TRIALS_PER_STRATEGY
use_cv: false

min_return: 0.10
min_sharpe_ratio: 1.0
max_drawdown: -0.15
min_total_trades: 4
test_days: 5
test_months: 6
early_stop_threshold: 0.03
wf_min_window_win_rate: 0.5
use_wf_pruning: false          # true = 在 Optuna 中启用 Walk-Forward 剪枝（较慢但防过拟合）
wf_pruning_train_months: 6    # WF 训练窗口（月）
wf_pruning_test_months: 2     # WF 测试窗口（月）
wf_pruning_step_months: 2     # WF 滑动步长（月）

sentiment_weight: 0.03

# 全市场选股：先做可交易性过滤，再按动量、趋势、量价评分。
screener:
  universe: hk
  top_n: 10
  min_score: 50.0
  min_price: 1.0               # 最新收盘价至少 1 港元
  liquidity_window: 20
  min_median_turnover: 10000000 # 近20日成交额中位数至少 1000 万港元
  min_trading_days: 19          # 近20日至少 19 天有有效成交
  stability_window: 60
  max_consecutive_no_trade_days: 2
  max_abs_return_1d: 0.30       # 单日绝对涨跌超过30%时暂不进入候选
  max_data_lag_days: 7           # 相对全市场最新行情最多落后7个自然日
  weight_momentum: 0.30
  weight_trend: 0.30
  weight_volume: 0.25
  weight_liquidity: 0.15

stacking:
  aggregation_method: vote    # "vote" | "stacking"
  meta_dir: data/meta
  label_days: 5
  n_splits: 5

slippage: 0.001
stamp_duty: 0.001

risk_management:
  use_atr_stop: true
  atr_period: 14
  atr_multiplier: 2.0
  trailing_stop: true
  simulate_in_backtest: true
  cooldown_bars: 0
  use_kelly: false
  kelly_fraction: 0.5
  max_position_pct: 0.25
  portfolio_value: 200000.0
  daily_loss_limit: 0.05
  max_consecutive_loss_days: 3

# 纸面交易：只更新本地模拟持仓，不连接券商、不下实盘订单
paper_trading:
  enabled: true
  min_confidence: 0.55
  max_new_positions_per_day: 3
  reserve_cash_pct: 0.05
  lot_size: 1

# 港交所官方每手股数。买入必须按整手；卖出已有持仓时允许整仓卖出碎股。
board_lots:
  enabled: true
  required: true
  fallback_lot_size: 1
  overrides: {}

strategy_training:
  # 每日组合训练最多处理 30 只；实际持仓始终优先且不会因上限被排除
  portfolio_max_tickers: 30
  custom: []
  multi:
    - xgboost_enhanced
    - lightgbm_enhanced
  single:
    - rnn_trend
    - bollinger_rsi_trend
    - macd_rsi_trend
    - rsi_divergence
    - macd_rsi_combo
    - atr_breakout
    - vwap_momentum
    - stochastic_oscillator
    - rsi_drawdown_0225
    - ma_crossover

daily_run:
  enable_screener: true
  persist_screener_picks: true
  max_workers: 4
  min_factor_age_days: 7
  retrain_on_stale: true
